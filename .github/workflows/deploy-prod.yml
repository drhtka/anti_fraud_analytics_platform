name: Deploy to prod server

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      REMOTE_DIR: /home/drhtka/projects/anti_fraud_analytics_platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ensure rsync is available
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Sync project to server
        run: |
          rsync -az --delete --delete-excluded \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.cache/' \
            --exclude '.dbg/' \
            --exclude '.vscode/' \
            --exclude 'node_modules/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.pyd' \
            --exclude 'data/raw/' \
            --exclude 'docs/' \
            --exclude '.env' \
            --no-owner --no-group --no-perms \
            --chmod='Fu=rw,Fg=rw,Fo=r,Du=rwx,Dg=rwx,Do=rx' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"

      - name: Rebuild and restart app and worker
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
          set -euo pipefail
          cd /home/drhtka/projects/anti_fraud_analytics_platform
          sudo docker compose build --no-cache app worker
          sudo docker compose up -d --force-recreate app worker
          EOF
