<section class="screen" data-screen-name="dashboard" hidden>
    <article class="content-card">
        <h2>Дашборд</h2>
        <p>
            Цей екран вбудовує поточний employer-facing BI-дашборд з Looker
            Studio прямо в застосунок, щоб демо скорингу та BI-історія були в
            одному місці.
        </p>

        <div class="dashboard-meta">
            <div class="metric">
                <span class="metric-label">Джерело</span>
                <span class="metric-value">Looker Studio</span>
            </div>
            <div class="metric">
                <span class="metric-label">Режим</span>
                <span class="metric-value">Вбудований iframe</span>
            </div>
        </div>

        <div class="dashboard-frame-card">
            <iframe
                class="dashboard-iframe"
                src="{{ dashboard_embed_url }}"
                title="Антифрод BI-дашборд"
                loading="lazy"
                allowfullscreen
                sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
            ></iframe>
        </div>
    </article>
</section>
