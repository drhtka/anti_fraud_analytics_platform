<section class="screen" data-screen-name="dashboard" hidden>
    <article class="content-card">
        <h2>Dashboard</h2>
        <p>
            This screen embeds the current Looker Studio employer-facing BI
            dashboard inside the app so the scoring demo and BI story stay in
            one place.
        </p>

        <div class="dashboard-meta">
            <div class="metric">
                <span class="metric-label">Source</span>
                <span class="metric-value">Looker Studio</span>
            </div>
            <div class="metric">
                <span class="metric-label">Mode</span>
                <span class="metric-value">Embedded iframe</span>
            </div>
        </div>

        <div class="dashboard-frame-card">
            <iframe
                class="dashboard-iframe"
                src="{{ dashboard_embed_url }}"
                title="Anti-Fraud BI Dashboard"
                loading="lazy"
                allowfullscreen
                sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
            ></iframe>
        </div>
    </article>
</section>
