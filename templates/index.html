<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .intro {
            margin-bottom: 24px;
            color: #4b5563;
        }

        form {
            display: grid;
            gap: 16px;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
        }

        button {
            width: fit-content;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .placeholder {
            margin-top: 20px;
            padding: 20px;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
        }

        .placeholder h2 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .placeholder ul {
            margin: 0;
            padding-left: 20px;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <main>
        <h1>Anti-Fraud Transaction Scoring</h1>
        <p class="intro">
            Week 4 UI MVP starts with a single page form. In the next step, this form will submit data to
            the existing <code>/score</code> and <code>/explain</code> endpoints.
        </p>

        <form>
            <div class="grid">
                <label>
                    Transaction ID
                    <input type="number" name="transaction_id" placeholder="1000001">
                </label>

                <label>
                    Transaction Amount
                    <input type="number" step="0.01" min="0" name="transaction_amount" placeholder="350.75" required>
                </label>

                <label>
                    ProductCD
                    <input type="text" name="product_cd" placeholder="C" required>
                </label>

                <label>
                    card1
                    <input type="number" name="card1" placeholder="13926" required>
                </label>

                <label>
                    card4
                    <input type="text" name="card4" placeholder="discover">
                </label>

                <label>
                    card6
                    <input type="text" name="card6" placeholder="credit">
                </label>

                <label>
                    Purchaser Email Domain
                    <input type="text" name="p_emaildomain" placeholder="outlook.com">
                </label>

                <label>
                    Recipient Email Domain
                    <input type="text" name="r_emaildomain" placeholder="gmail.com">
                </label>
            </div>

            <button type="submit">Score transaction</button>
        </form>

        <section class="placeholder">
            <h2>Result Preview</h2>
            <ul>
                <li>fraud_score</li>
                <li>risk_label</li>
                <li>needs_manual_review</li>
                <li>active_signals</li>
                <li>explanation_text</li>
            </ul>
        </section>
    </main>
</body>
</html>
